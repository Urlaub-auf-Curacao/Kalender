<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #2b2a28;
    background: transparent;
    margin: 0;
    padding: 10px;
    box-sizing: border-box;
  }
  .bp-karte {
    background: #faf8f4;
    border: 1px solid #e6e1d8;
    border-radius: 12px;
    padding: 20px;
    max-width: 420px;
    margin: 0 auto;
    box-sizing: border-box;
  }
  .bp-kopf {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
  }
  .bp-nav {
    background: #fff;
    border: 1px solid #d9d4cb;
    color: #2b2a28;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bp-nav:hover:not(:disabled) {
    border-color: #1f6f78;
    color: #1f6f78;
    background: #d6ebec;
  }
  .bp-nav:disabled { opacity: 0.3; cursor: default; }
  .bp-titel {
    font-weight: 600;
    font-size: 16px;
    text-align: center;
    flex: 1;
  }
  .bp-monat { background: #fff; border: 1px solid #e6e1d8; border-radius: 8px; padding: 15px; }
  .bp-monatsname { font-weight: 600; text-align: center; margin: 0 0 12px; font-size: 15px; color: #1f6f78; }
  .bp-wt-leiste { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .bp-wt { font-size: 11px; text-transform: uppercase; color: #6f6c66; text-align: center; flex: 1; font-weight: 600; }
  .bp-raster { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .bp-tag {
    aspect-ratio: 1 / 1;
    border: 1px solid #d9d4cb;
    background: #ffffff;
    color: #2b2a28;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 500;
    padding: 0;
    margin: 0;
    width: 100%;
  }
  .bp-tag.bp-frei:hover { border-color: #1f6f78; background: #d6ebec; color: #1f6f78; }
  .bp-leer { visibility: hidden; border: none; background: transparent; }
  .bp-tag.bp-belegt { background: #c4513a; border-color: #c4513a; color: #fff; cursor: not-allowed; }
  .bp-tag.bp-vergangen { background: #f4f2ee; border-color: transparent; color: #b8b3a8; cursor: default; }
  .bp-tag.bp-heute { border-color: #1f6f78; font-weight: 700; }
  .bp-tag.bp-im-bereich { background: #d6ebec; border-color: #1f6f78; color: #1f6f78; }
  .bp-tag.bp-auswahl { background: #1f6f78; border-color: #1f6f78; color: #fff; font-weight: 700; }
  .bp-legende { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 15px; font-size: 13px; color: #6f6c66; justify-content: center; }
  .bp-legende span { display: inline-flex; align-items: center; gap: 6px; }
  .bp-legende i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid #d9d4cb; }
  .bp-form { margin-top: 15px; background: #faf8f4; border: 1px solid #e6e1d8; border-radius: 10px; padding: 15px; }
  .bp-form h3 { margin: 0 0 8px; font-size: 16px; font-weight: 600; color: #2b2a28; }
  .bp-zeitraum { display: flex; gap: 10px; margin-bottom: 12px; }
  .bp-zeitraum div { flex: 1; background: #fff; border: 1px solid #e6e1d8; border-radius: 6px; padding: 8px 10px; }
  .bp-zeitraum small { display: block; font-size: 10px; text-transform: uppercase; color: #6f6c66; margin-bottom: 2px; }
  .bp-zeitraum strong { font-size: 13px; color: #2b2a28; }
  .bp-felder { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bp-voll { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #2b2a28; }
  input[type=text], input[type=email], input[type=number], textarea {
    width: 100%; font: inherit; font-size: 13px; color: #2b2a28; background: #fff; border: 1px solid #d9d4cb; border-radius: 6px; padding: 8px; box-sizing: border-box;
  }
  textarea { min-height: 70px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: #1f6f78; box-shadow: 0 0 0 2px rgba(31,111,120,0.15); }
  .bp-hp { position: absolute !important; left: -9999px !important; width: 1px; height: 1px; overflow: hidden; }
  .bp-btn { background: #1f6f78; color: #fff; border: none; border-radius: 6px; padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; }
  .bp-btn:hover:not(:disabled) { background: #17535b; }
  .bp-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .bp-meldung { margin-top: 10px; padding: 10px; border-radius: 6px; font-size: 13px; }
  .bp-meldung.bp-ok { background: #e4f1e6; color: #1d5b2b; }
  .bp-meldung.bp-err { background: #f8e3de; color: #8c2f1c; }
  .bp-hinweis.bp-warnung { color: #c4513a; font-weight: 600; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>

<div id="bp-belegungsplan">Lade Belegungsplan...</div>

<script>
(function () {
  var CONFIG = {
    API_URL: "https://script.google.com/macros/s/AKfycbwLXOVlY7Mnco5s-jEmB-OvHTs0dFMAg9CSyFDsG8rbOlk_IJuRhqN0-yfTa41BTpYb-Q/exec", // <-- Ihre Google /exec URL eintragen
    MONATE_VORAUS: 18,
    MIN_NAECHTE: 1,
    MAX_PERSONEN: 8,
    TEXT_TITEL: "Unverbindlich anfragen",
    TEXT_DANKE: "Vielen Dank für Ihre Anfrage. Wir melden uns in Kürze bei Ihnen."
  };

  var root = document.getElementById("bp-belegungsplan");
  var MONATE = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  var WT = ["Mo","Di","Mi","Do","Fr","Sa","So"];
  var heute = new Date(); heute.setHours(0, 0, 0, 0);
  
  var state = {
    belegung: {}, offset: 0,
    start: null, ende: null,
    sendet: false, meldung: null,
    form: { vorname: "", nachname: "", email: "", erwachsene: "2", kinder: "0", nachricht: "", website: "" }
  };

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function key(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parse(s) { var p = String(s).slice(0, 10).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function plusTage(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function naechte(a, b) { return Math.round((b - a) / 86400000); }
  function deDatum(d) { return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + d.getFullYear(); }
  function esc(s) { return String(s || "").replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  function ladeDaten() {
    if (!CONFIG.API_URL || CONFIG.API_URL.indexOf("HIER_") === 0) { render(); return; }
    fetch(CONFIG.API_URL)
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.ok && Array.isArray(data.belegung)) {
          var map = {};
          data.belegung.forEach(function(dStr) { map[dStr] = "belegt"; });
          state.belegung = map;
        }
        render();
      })
      .catch(function() { root.innerHTML = "Fehler beim Laden der Belegung."; });
  }

  function klickTag(d) {
    if (d < heute || state.belegung[key(d)] === "belegt") return;
    if (!state.start || (state.start && state.ende)) {
      state.start = d; state.ende = null; state.meldung = null;
    } else if (state.start && !state.ende) {
      if (d <= state.start) {
        state.start = d;
      } else {
        var blockiert = false;
        var curr = plusTage(state.start, 1);
        while (curr < d) {
          if (state.belegung[key(curr)] === "belegt") { blockiert = true; break; }
          curr = plusTage(curr, 1);
        }
        if (blockiert) { state.start = d; state.ende = null; }
        else { state.ende = d; }
      }
    }
    render();
  }

  function render() {
    var m1 = new Date(heute.getFullYear(), heute.getMonth() + state.offset, 1);
    var html = '<div class="bp-karte">';
    html += '<div class="bp-kopf"><button class="bp-nav" ' + (state.offset <= 0 ? 'disabled' : '') + ' id="bp-prev">&#10094;</button><div class="bp-titel">' + MONATE[m1.getMonth()] + ' ' + m1.getFullYear() + '</div><button class="bp-nav" ' + (state.offset >= CONFIG.MONATE_VORAUS - 1 ? 'disabled' : '') + ' id="bp-next">&#10095;</button></div>';

    var y = m1.getFullYear(), m = m1.getMonth();
    var ersterTag = new Date(y, m, 1);
    var letzterTag = new Date(y, m + 1, 0);
    var startWochentag = (ersterTag.getDay() + 6) % 7;

    html += '<div class="bp-monat"><div class="bp-wt-leiste">';
    for (var i = 0; i < 7; i++) html += '<div class="bp-wt">' + WT[i] + '</div>';
    html += '</div><div class="bp-raster">';
    for (var i = 0; i < startWochentag; i++) html += '<div class="bp-tag bp-leer"></div>';
    for (var t = 1; t <= letzterTag.getDate(); t++) {
      var d = new Date(y, m, t);
      var kStr = key(d);
      var status = state.belegung[kStr];
      var istVergangen = d < heute;
      var istHeute = d.getTime() === heute.getTime();
      var css = "bp-tag";
      if (istVergangen) css += " bp-vergangen";
      else if (status === "belegt") css += " bp-belegt";
      else css += " bp-frei";
      if (istHeute) css += " bp-heute";
      if (state.start && !state.ende && state.start.getTime() === d.getTime()) css += " bp-auswahl";
      if (state.start && state.ende && d > state.start && d < state.ende) css += " bp-im-bereich";
      if (state.start && state.ende && state.ende.getTime() === d.getTime()) css += " bp-auswahl";
      html += '<button type="button" class="' + css + '" data-datum="' + kStr + '" ' + (istVergangen || status === "belegt" ? 'disabled' : '') + '>' + t + '</button>';
    }
    html += '</div></div>';

    html += '<div class="bp-legende"><span><i style="background:#fff"></i> Frei</span><span><i style="background:#c4513a"></i> Belegt</span><span><i style="background:#1f6f78"></i> Auswahl</span></div></div>';

    var n = (state.start && state.ende) ? naechte(state.start, state.ende) : 0;
    html += '<div class="bp-form"><h3>' + CONFIG.TEXT_TITEL + '</h3>';
    html += '<div class="bp-zeitraum"><div><small>Anreise</small><strong>' + (state.start ? deDatum(state.start) : 'Bitte wählen...') + '</strong></div><div><small>Abreise</small><strong>' + (state.ende ? deDatum(state.ende) : 'Bitte wählen...') + '</strong></div>';
    if (n > 0) html += '<div><small>Dauer</small><strong>' + n + ' Nächte</strong></div>';
    html += '</div>';

    if (n > 0 && n < CONFIG.MIN_NAECHTE) {
      html += '<div class="bp-hinweis bp-warnung">Mindestaufenthalt: ' + CONFIG.MIN_NAECHTE + ' Nächte.</div>';
    }

    html += '<div class="bp-felder">';
    html += '<div><label>Vorname *</label><input type="text" id="bp-vorname" value="' + esc(state.form.vorname) + '"></div>';
    html += '<div><label>Nachname *</label><input type="text" id="bp-nachname" value="' + esc(state.form.nachname) + '"></div>';
    html += '<div class="bp-voll"><label>E-Mail-Adresse *</label><input type="email" id="bp-email" value="' + esc(state.form.email) + '"></div>';
    html += '<div><label>Erwachsene</label><input type="number" id="bp-erw" min="1" max="' + CONFIG.MAX_PERSONEN + '" value="' + esc(state.form.erwachsene) + '"></div>';
    html += '<div><label>Kinder</label><input type="number" id="bp-kinder" min="0" max="' + CONFIG.MAX_PERSONEN + '" value="' + esc(state.form.kinder) + '"></div>';
    html += '<div class="bp-voll"><label>Nachricht / Notizfeld</label><textarea id="bp-nachr">' + esc(state.form.nachricht) + '</textarea></div>';
    html += '<div class="bp-hp"><input type="text" id="bp-web" value="' + esc(state.form.website) + '"></div>';
    html += '<div class="bp-voll"><button class="bp-btn" id="bp-senden"' + (state.sendet ? ' disabled' : '') + '>Anfrage absenden</button></div>';
    html += '</div>';

    if (state.meldung) {
      html += '<div class="bp-meldung ' + (state.meldung.ok ? 'bp-ok' : 'bp-err') + '">' + esc(state.meldung.text) + '</div>';
    }
    html += '</div>';

    root.innerHTML = html;
    bindEvents();
  }

  function bindEvents() {
    var prev = document.getElementById("bp-prev");
    var next = document.getElementById("bp-next");
    if (prev) prev.onclick = function() { state.offset--; render(); };
    if (next) next.onclick = function() { state.offset++; render(); };

    var buttons = root.querySelectorAll("[data-datum]");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].onclick = function() {
        klickTag(parse(this.getAttribute("data-datum")));
      };
    }

    var vName = document.getElementById("bp-vorname");
    var nName = document.getElementById("bp-nachname");
    var email = document.getElementById("bp-email");
    var erw = document.getElementById("bp-erw");
    var kind = document.getElementById("bp-kinder");
    var nachr = document.getElementById("bp-nachr");
    var btnSenden = document.getElementById("bp-senden");

    if (vName) vName.oninput = function() { state.form.vorname = this.value; };
    if (nName) nName.oninput = function() { state.form.nachname = this.value; };
    if (email) email.oninput = function() { state.form.email = this.value; };
    if (erw) erw.oninput = function() { state.form.erwachsene = this.value; };
    if (kind) kind.oninput = function() { state.form.kinder = this.value; };
    if (nachr) nachr.oninput = function() { state.form.nachricht = this.value; };

    if (btnSenden) {
      btnSenden.onclick = function() {
        var web = document.getElementById("bp-web");
        if (web && web.value) return; // Spam-Schutz

        if (!state.form.vorname || !state.form.nachname || !state.form.email) {
          state.meldung = { ok: false, text: "Bitte füllen Sie Vorname, Nachname und E-Mail aus." };
          render();
          return;
        }

        if (!state.start || !state.ende) {
          state.meldung = { ok: false, text: "Bitte wählen Sie An- und Abreisedatum im Kalender aus." };
          render();
          return;
        }

        state.sendet = true;
        render();

        var payload = {
          anreise: state.start ? deDatum(state.start) : "Nicht angegeben",
          abreise: state.ende ? deDatum(state.ende) : "Nicht angegeben",
          naechte: state.start && state.ende ? naechte(state.start, state.ende) : 0,
          name: state.form.vorname + " " + state.form.nachname,
          email: state.form.email,
          erwachsene: state.form.erwachsene,
          kinder: state.form.kinder,
          nachricht: state.form.nachricht
        };

        fetch(CONFIG.API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        })
        .then(function(res) { return res.json(); })
        .then(function(res) {
          state.sendet = false;
          if (res.ok) {
            state.meldung = { ok: true, text: CONFIG.TEXT_DANKE };
            state.start = null; state.ende = null;
            state.form = { vorname: "", nachname: "", email: "", erwachsene: "2", kinder: "0", nachricht: "", website: "" };
          } else {
            state.meldung = { ok: false, text: "Fehler vom Server: " + (res.fehler || res.error || "Unbekannt") };
          }
          render();
        })
        .catch(function(err) {
          state.sendet = false;
          state.meldung = { ok: false, text: "Netzwerk- oder CORS-Fehler: " + err };
          render();
        });
      };
    }
   } 
  
  ladeDaten();
})();
</script>
</body>
</html>
